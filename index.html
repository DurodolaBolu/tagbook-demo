  const ord={no,phone,branch,items:lines.map(([id,svc,qty,label])=>({id,svc,qty,label})),express:!!o.express,pickup:!!o.pickup,
    delivery:o.delivery||0,discount:0,custom:o.custom||{},status:o.status,billed:!!o.billed,paid:o.paid||0,
    dropped:day(o.dropped),at:dayTs(o.dropped),payments:[],checked:{},checking:false,notified:o.status!=="new",again:{}};
  if(o.billed)ord.billedAt=dayTs(Math.min(0,o.dropped+1));
  if(o.paid)ord.payments.push({amt:o.paid,at:dayTs(o.dropped)});
  if(o.billed)lockPrices(ord);
  if(o.paidAll){ord.paid=calc(ord).total;ord.payments.push({amt:ord.paid,at:dayTs(Math.min(0,o.dropped+4))});}
  return ord;
}
function lockPrices(o){o.unit=o.items.map((it,i)=>PRICES.find(x=>x.id===it.id).custom?null:unitPrice({...o,unit:null},it,i));}
function unitPrice(o,it,i){if(o.unit&&o.unit[i]!=null)return o.unit[i];const p=PRICES.find(x=>x.id===it.id);if(p.custom)return +o.custom[i]||0;return (p.p&&p.p[it.svc])||0;}
function expressFor(sub){return settings.expressType==="percent"?Math.round(sub*settings.expressValue/100/50)*50:settings.expressValue;}
function calc(o){
  const sub=o.items.reduce((s,it,i)=>s+unitPrice(o,it,i)*it.qty,0);
  const exp=o.express?expressFor(sub):0;
  const total=Math.max(0,sub+exp+(+o.delivery||0)-(+o.discount||0));
  return {sub,exp,total,count:o.items.reduce((s,it)=>s+it.qty,0)};
}
const cust=p=>customers.find(c=>c.phone===p);
const owed=o=>o.billed?Math.max(0,calc(o).total-o.paid):0;
const pname=it=>it.label||PRICES.find(x=>x.id===it.id).name;
const expressLabel=()=>settings.expressType==="percent"?`+${settings.expressValue}%`:`+${naira(settings.expressValue)}`;

function pills(o){

  if(own&&!o.billed&&o.status!=="new")h+=`<span class="pill p-new">No bill yet</span>`;

function suggest(name){
  const parts=name.trim().split(/\s+/).filter(Boolean);const tries=[];
  if(parts[0])tries.push(parts[0].slice(0,2));
  if(parts[0]&&parts[1])tries.push(parts[0][0]+parts[1][0]);
  if(parts[0])tries.push(parts[0][0]+(parts[0][2]||"X"));
  for(const t of tries){const m=t.toUpperCase().replace(/[^A-Z]/g,"");if(m.length===2&&!customers.some(c=>c.mark===m))return m;}
  const base=(tries[0]||"XX").toUpperCase();let n=2;while(customers.some(c=>c.mark===base+n))n++;return base+n;
}

/* ---------- Messages ---------- */
function billLines(o){
  const k=calc(o);
  return o.items.map((it,i)=>`${it.qty} x ${pname(it)} ${naira(unitPrice(o,it,i)*it.qty)}`).join("\n")
    +(k.exp?`\nExpress delivery: ${naira(k.exp)}`:"")+(o.delivery?`\nPickup/delivery: ${naira(o.delivery)}`:"")+(o.discount?`\nDiscount: -${naira(o.discount)}`:"");
}
function message(o,type){
  const c=cust(o.phone),k=calc(o),first=c.name.split(" ")[0];
  if(type==="list"){
    const list=o.items.map(it=>`${it.qty} x ${pname(it)} (${SERVICES[it.svc]})`).join("\n");
    return `Hello ${first}, ${shop()} has received your clothes.\nOrder #${o.no} · Mark ${c.mark} · ${k.count} items\n\n${list}${o.paid?`\n\nPayment received: ${naira(o.paid)}`:""}\n\nWe will let you know when your clothes are ready, and send your bill with it.\n\n_Sent with Tagbook_`;
  }
  if(type==="ready")return `Hello ${first}, your clothes are ready at ${shop()}.\nCollect at: ${BRANCHES[o.branch]}\n\nINVOICE INV-${o.no}\nDate: ${day(0)}\nCustomer: ${c.name} (Mark ${c.mark})\n${k.count} items\n\n${billLines(o)}\n\nTotal: ${naira(k.total)}${o.paid?`\nPaid: ${naira(o.paid)}`:""}${owed(o)?`\nAmount to pay: ${naira(owed(o))}${payTo()}`:"\nFully paid. Thank you."}\n\n_Sent with Tagbook_`;
  return `Hello ${first}, a reminder from ${shop()}: invoice INV-${o.no} has ${naira(owed(o))} still to pay.${payTo()}\n\nThank you.\n_Sent with Tagbook_`;
}
const isSample=o=>{const c=cust(o.phone);return !!(c&&c.sample);};
const waFmt=t=>esc(t).replace(/(^|\s)_([^_\n]+)_(?=\s|$)/g,"$1<i>$2</i>").replace(/(^|\s)\*([^*\n]+)\*(?=\s|$)/g,"$1<b>$2</b>");
const wa=(o,t)=>(isSample(o)?"https://wa.me/":"https://wa.me/234"+o.phone.slice(1))+"?text="+encodeURIComponent(t);
const MSG_NAMES={list:"list of clothes",ready:"clothes ready, with invoice",owe:"payment reminder"};
function waBlock(o,type,markable){

  if(own)o.notified=true;
  const idx=STEPS.findIndex(s=>s[0]===o.status);
  const allChecked=o.items.every((_,i)=>o.checked[i]);
  const canEditBill=own&&o.status!=="picked";

      ${o.billed&&(o.status==="told"||o.status==="picked")?`<div><span>Payment</span><span class="pill ${owed(o)?"p-owed":"p-collected"}">${owed(o)?"Not paid":"Paid"}</span></div>`:""}</div>`;
    html+=checkHtml();
    if(o.status==="ready")html+=`<p class="hint" style="margin-top:12px">Ready and bagged. Waiting for the owner to tell the customer.</p>`;

  if(o.status==="ready"||o.status==="told")html+=`<button class="btn btn-ghost" id="pick" style="margin-top:16px">Clothes picked up</button>
    <p class="hint">Mark this when the customer takes the clothes${own?". Payment is recorded separately, because some customers pay later.":". Payment is recorded by the owner."}</p>`;

  const y=sh.hidden?0:sh.scrollTop;
  sh.innerHTML=`<div class="app">

    <div class="steps"><span class="fill" style="width:${idx*20}%"></span>${STEPS.map((s,i)=>`<div class="st ${i<idx||(i===idx&&o.status==="picked")?"done":i===idx?"cur":""}">${s[1]}</div>`).join("")}</div>

  const live=()=>{const kk=calc(o);$("#tot").textContent=naira(kk.total);$("#exv").textContent=naira(kk.exp);};

  moneyInput($("#dc"),v=>{o.discount=v;live();});
  moneyInput($("#pay"),()=>{});
  if($("#ex"))$("#ex").onchange=e=>{o.express=e.target.checked;live();};
  const bill=$("#bill");if(bill)bill.onclick=()=>{
    const miss=o.items.find((it,i)=>PRICES.find(p=>p.id===it.id).custom&&!o.custom[i]);
    if(miss){toast(`Set a price for ${pname(miss)} first`);return;}
    lockPrices(o);o.billed=true;o.billedAt=o.billedAt||Date.now();toast("Bill saved");again();};
  const pp=$("#pp");if(pp)pp.onclick=()=>{const v=num($("#pay").value);if(!v){toast("Type the amount received");return;}
    const before=o.paid;o.paid=o.billed?Math.min(calc(o).total,o.paid+v):o.paid+v;if(o.paid>before)(o.payments=o.payments||[]).push({amt:o.paid-before,at:Date.now()});toast(o.billed&&owed(o)?`Recorded. ${naira(owed(o))} still to pay.`:o.billed?"Fully paid":`Recorded ${naira(o.paid)} paid early`);again();};
  const w=$("#washed");if(w)w.onclick=()=>{o.checking=true;again();};
  sh.querySelectorAll("[data-ck]").forEach(b=>b.onchange=()=>{o.checked[b.dataset.ck]=b.checked;again();});

  const pk=$("#pick");if(pk)pk.onclick=()=>{o.status="picked";toast(owed(o)?"Picked up. Not fully paid yet.":"Picked up");again();};
}

/* ---------- Reports (owner) ---------- */
/* Demo history: a steady shop's past days, made the same way on every load. The real app reads this from the database. */
const HISTORY=(()=>{let a=20261105;const rnd=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const h={},start=new Date(today);start.setHours(0,0,0,0);
  for(let i=700;i>=0;i--){const dt=new Date(start);dt.setDate(dt.getDate()-i);const dow=dt.getDay();
    const base=dow===0?2:dow===6?22:dow===1?10:14,grow=(0.7+0.3*(1-i/700))*(i===0?Math.min(1,Math.max(0,(new Date().getHours()-8)/10)):1);
    const n=Math.max(0,Math.round(base*grow*(0.7+rnd()*0.6)));let cl=0,bill=0;
    for(let j=0;j<n;j++){const c=2+Math.floor(rnd()*8);cl+=c;bill+=Math.round(c*(650+rnd()*500)/50)*50;}
    h[dkey(dt)]={orders:n,clothes:cl,billed:bill,received:Math.round(bill*(0.88+rnd()*0.1)/50)*50};}
  return h;})();
function dkey(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
const FIRST_DAY=(()=>{const x=new Date(today);x.setHours(0,0,0,0);x.setDate(x.getDate()-700);return x;})();
function liveByDay(){const m={};const add=(ts,f,v)=>{const k=dkey(new Date(ts));(m[k]=m[k]||{orders:0,clothes:0,billed:0,received:0})[f]+=v;};
  orders.forEach(o=>{if(o.at){add(o.at,"orders",1);add(o.at,"clothes",calc(o).count);}if(o.billed&&o.billedAt)add(o.billedAt,"billed",calc(o).total);(o.payments||[]).forEach(p=>add(p.at,"received",p.amt));});return m;}
function dayStats(d,live){const k=dkey(d),a=HISTORY[k]||{},b=live[k]||{};return{orders:(a.orders||0)+(b.orders||0),clothes:(a.clothes||0)+(b.clothes||0),billed:(a.billed||0)+(b.billed||0),received:(a.received||0)+(b.received||0)};}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
let rep={type:"week",k:0,sel:null};
function periodRange(type,k){const t=new Date(today);t.setHours(0,0,0,0);let s,e;
  if(type==="day"){s=new Date(t);s.setDate(s.getDate()+k);e=new Date(s);e.setDate(e.getDate()+1);}
  else if(type==="week"){s=new Date(t);s.setDate(s.getDate()-((s.getDay()+6)%7)+7*k);e=new Date(s);e.setDate(e.getDate()+7);}
  else if(type==="month"){s=new Date(t.getFullYear(),t.getMonth()+k,1);e=new Date(t.getFullYear(),t.getMonth()+k+1,1);}
  else{s=new Date(t.getFullYear()+k,0,1);e=new Date(t.getFullYear()+k+1,0,1);}
  return{s,e};}
function periodLabel(type,k,{s,e}){
  if(type==="day")return k===0?"Today":k===-1?"Yesterday":`${DOW[s.getDay()]} ${s.getDate()} ${MON[s.getMonth()]}`;
  if(type==="week"){const l=new Date(e);l.setDate(l.getDate()-1);return (k===0?"This week · ":k===-1?"Last week · ":"")+`${s.getDate()} ${MON[s.getMonth()]} to ${l.getDate()} ${MON[l.getMonth()]}`;}
  if(type==="month")return (k===0?"This month · ":"")+`${MON[s.getMonth()]} ${s.getFullYear()}`;
  return (k===0?"This year · ":"")+s.getFullYear();}
function sumRange(s,e,live){const tot={orders:0,clothes:0,billed:0,received:0};const d=new Date(s);const now=new Date(today);now.setHours(23,59,59,999);
  while(d<e&&d<=now){const x=dayStats(d,live);for(const f in tot)tot[f]+=x[f];d.setDate(d.getDate()+1);}return tot;}
function buckets(type,{s,e},live){const out=[];const now=new Date(today);now.setHours(23,59,59,999);
  if(type==="week"||type==="month"){const d=new Date(s);while(d<e){const fut=d>now;out.push({label:type==="week"?DOW[d.getDay()]:String(d.getDate()),full:`${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`,v:fut?null:dayStats(d,live).received});d.setDate(d.getDate()+1);}}
  else if(type==="year"){for(let m=0;m<12;m++){const a=new Date(s.getFullYear(),m,1),b=new Date(s.getFullYear(),m+1,1);out.push({label:MON[m][0],full:`${MON[m]} ${s.getFullYear()}`,v:a>now?null:sumRange(a,b,live).received});}}
  return out;}
function renderReports(){
  const live=liveByDay(),R=periodRange(rep.type,rep.k),P=periodRange(rep.type,rep.k-1);
  const cur=sumRange(R.s,R.e,live);
  let pe=P.e;if(rep.k===0&&rep.type!=="day"){const t=new Date(today);t.setHours(0,0,0,0);const days=Math.round((t-R.s)/864e5)+1;pe=new Date(P.s);pe.setDate(pe.getDate()+days);if(pe>P.e)pe=P.e;}
  const prev=sumRange(P.s,pe,live);
  const canBack=P.e>FIRST_DAY,canFwd=rep.k<0;
  const owingNow=orders.reduce((s,o)=>s+((o.status==="told"||o.status==="picked")?owed(o):0),0);
  const prevName=rep.k===0&&rep.type!=="day"?{week:"the same days last week",month:"the same days last month",year:"the same days last year"}[rep.type]:{day:rep.k===0?"yesterday":"the day before",week:"the week before",month:"the month before",year:"the year before"}[rep.type];
  const diff=prev.received?Math.round((cur.received-prev.received)/prev.received*100):null;
  const bars=buckets(rep.type,R,live),max=Math.max(1,...bars.map(b=>b.v||0));
  const sel=rep.sel!=null&&bars[rep.sel]&&bars[rep.sel].v!=null?bars[rep.sel]:null;
  const partial=rep.k===0&&rep.type!=="day"?" so far":"";
  view.innerHTML=`${backBtn("Orders")}<h2>Reports</h2>
    <div class="chips">${[["day","Day"],["week","Week"],["month","Month"],["year","Year"]].map(([k,l])=>`<button class="chip" data-rt="${k}" aria-pressed="${rep.type===k}">${l}</button>`).join("")}</div>
    <div class="rnav"><button class="rbtn" id="rprev" aria-label="Previous" ${canBack?"":"disabled"}>‹</button><b>${periodLabel(rep.type,rep.k,R)}</b><button class="rbtn" id="rnext" aria-label="Next" ${canFwd?"":"disabled"}>›</button></div>
    <div class="rhero"><span>Money received${partial}</span><b>${naira(cur.received)}</b>
      <small>${diff==null?"":`${diff>=0?"Up":"Down"} ${Math.abs(diff)}% on ${prevName} (${naira(prev.received)})`}</small></div>
    ${bars.length?`<div class="rchart" role="img" aria-label="Money received by ${rep.type==="year"?"month":"day"}">
      <p class="rsel">${sel?`${sel.full}: <b>${naira(sel.v)}</b>`:"Tap a bar to see that "+(rep.type==="year"?"month":"day")}</p>
      <div class="rbars ${bars.length>12?"dense":""}">${bars.map((b,i)=>`<button class="rbar ${rep.sel===i?"on":""}" data-bi="${i}" ${b.v==null?"disabled":""} aria-label="${b.full}: ${b.v==null?"not yet":naira(b.v)}"><i style="height:calc((100% - 20px) * ${b.v==null?0:Math.max(0.02,b.v/max).toFixed(3)})"></i><span>${bars.length>12&&(i%5!==0)?"":b.label}</span></button>`).join("")}</div></div>`:""}
    <div class="stats rstats">
      <div class="stat"><b>${naira(cur.billed)}</b><span>Billed</span></div>
      <div class="stat"><b>${cur.orders}</b><span>Orders</span></div>
      <div class="stat"><b>${cur.clothes}</b><span>Clothes</span></div>
    </div>
    <div class="lines"><div><span>Owed to you right now</span><b style="color:${owingNow?"var(--owes)":"inherit"}">${naira(owingNow)}</b></div></div>
    <p class="hint">Money received counts payments on the day they came in. Billed counts bills on the day they were made, paid or not.</p>
    <p class="foot">Sample figures for the demo, from ${FIRST_DAY.getDate()} ${MON[FIRST_DAY.getMonth()]} ${FIRST_DAY.getFullYear()}.</p>`;
  wireBack(view);
  view.querySelectorAll("[data-rt]").forEach(b=>b.onclick=()=>{rep={type:b.dataset.rt,k:0,sel:null};renderReports();});
  $("#rprev").onclick=()=>{rep.k--;rep.sel=null;renderReports();};
  $("#rnext").onclick=()=>{rep.k++;rep.sel=null;renderReports();};
  view.querySelectorAll("[data-bi]").forEach(b=>b.onclick=()=>{rep.sel=+b.dataset.bi;renderReports();});
}

  $("#rst").onclick=()=>{if(!$("#rst").dataset.sure){$("#rst").dataset.sure="1";$("#rst").textContent="Tap again to reset";return;}try{localStorage.removeItem(SAVE_KEY);}catch(_){}location.hash="orders";location.reload();};
  moneyInput($("#an"),()=>{const el=$("#an");if(el.value.length>10)el.value=el.value.slice(0,10);settings.acctNo=el.value;save();$("#anx").textContent=settings.acctNo.length===10?"":"Account number must be 10 digits.";});
  view.querySelectorAll("[data-et]").forEach(b=>b.onclick=()=>{settings.expressType=b.dataset.et;settings.expressValue=b.dataset.et==="percent"?50:1000;renderSettings();});
  view.querySelectorAll("[data-pn]").forEach(i=>i.oninput=()=>{const p=PRICES.find(x=>x.id===i.dataset.pn);p.name=i.value.slice(0,40)||p.name;save();});
  view.querySelectorAll("[data-pp]").forEach(i=>moneyInput(i,v=>{PRICES.find(x=>x.id===i.dataset.pp).p[i.dataset.k]=i.value===""?null:v;save();}));
  view.querySelectorAll("[data-prm]").forEach(b=>b.onclick=()=>{if(!b.dataset.sure){b.dataset.sure="1";b.textContent="Tap again to remove";return;}PRICES.find(x=>x.id===b.dataset.prm).hidden=true;save();toast("Item removed from the price list");renderSettings();});
  view.querySelectorAll("[data-na]").forEach(i=>moneyInput(i,()=>{}));
  $("#nadd").onclick=()=>{const n=$("#ni").value.trim();if(!n){toast("Type the item name first");$("#ni").focus();return;}
    const pr={};let any=false;view.querySelectorAll("[data-na]").forEach(i=>{pr[i.dataset.na]=i.value===""?null:num(i.value);if(i.value!=="")any=true;});
    if(!any){toast("Set a price for at least one service");return;}
    const id="i"+Date.now().toString(36);const sp=PRICES.findIndex(p=>p.custom);PRICES.splice(sp<0?PRICES.length:sp,0,{id,name:n.slice(0,40),p:pr});save();toast(`${n} added`);renderSettings();};
  moneyInput($("#ev"),v=>{settings.expressValue=settings.expressType==="percent"?Math.min(v,300):v;$("#evx").textContent=exampleExpress();save();});
}
function exampleExpress(){return `Example: a ${naira(5000)} order marked express delivery costs ${naira(5000+expressFor(5000))}.`;}
route();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));}
</script>
<script>
/* Live site only: auto update + pull down to refresh */
(function(){
  var BUILD=window.TB_BUILD, $q=function(s){return document.querySelector(s)};
  var css=document.createElement("style");
  css.textContent="html,body{overscroll-behavior-y:contain}"+
    "#tb-ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:30;transform:translate(-50%,-80px);background:var(--card);color:var(--accent-deep);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:600 14px/18px var(--font);box-shadow:0 2px 8px rgba(3,25,30,.12);transition:transform .15s ease-out;pointer-events:none;white-space:nowrap}"+
    "#tb-upd{position:fixed;left:0;right:0;top:0;z-index:40;padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--accent);color:var(--accent-ink);font:600 15px/20px var(--font);text-align:center;border:0;width:100%;cursor:pointer}";
  document.head.appendChild(css);

  /* ---- auto update ---- */
  var shown=false;
  function busy(){var a=document.activeElement;return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName);}
  function onHome(){var sh=$q("#sheet");return (!sh||sh.hidden)&&(location.hash===""||location.hash==="#orders");}
  function showBar(){if(shown)return;shown=true;var b=document.createElement("button");b.id="tb-upd";b.textContent="New version ready. Tap to update.";b.onclick=function(){location.reload();};document.body.appendChild(b);}
  function check(){
    if(!BUILD||document.visibilityState!=="visible")return;
    fetch("/version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(j){
      if(!j||!j.v||j.v===BUILD)return;
      if(onHome()&&!busy())location.reload(); else showBar();
    }).catch(function(){});
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)navigator.serviceWorker.getRegistration().then(function(r){if(r)r.update();}).catch(function(){});
  }
  setInterval(check,60000);
  document.addEventListener("visibilitychange",check);
  window.addEventListener("focus",check);
  window.addEventListener("hashchange",function(){if(shown&&onHome()&&!busy())location.reload();});

  /* ---- pull down to refresh ---- */
  var ind=document.createElement("div");ind.id="tb-ptr";ind.textContent="Pull down to refresh";document.body.appendChild(ind);
  var y0=null,dy=0,GO=110;
  function scroller(){var sh=$q("#sheet");return sh&&!sh.hidden?sh:document.scrollingElement;}
  document.addEventListener("touchstart",function(e){
    if(e.touches.length!==1||scroller().scrollTop>0||busy()){y0=null;return;}
    y0=e.touches[0].clientY;dy=0;
  },{passive:true});
  document.addEventListener("touchmove",function(e){
    if(y0===null)return;dy=e.touches[0].clientY-y0;
    if(dy<=0){ind.style.transform="translate(-50%,-80px)";return;}
    var d=Math.min(dy*0.5,70);ind.style.transform="translate(-50%,"+(d-10)+"px)";
    ind.textContent=dy>GO?"Release to refresh":"Pull down to refresh";
  },{passive:true});
  document.addEventListener("touchend",function(){
    if(y0===null)return;
    if(dy>GO){ind.textContent="Refreshing…";location.reload();}
    else ind.style.transform="translate(-50%,-80px)";
    y0=null;dy=0;
  });
})();
</script>
</body></html>
